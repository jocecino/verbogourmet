<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0e2a52">
<link rel="apple-touch-icon" href="https://i.ibb.co/GjwfK1V/IMG-3685.jpg"><meta name="apple-mobile-web-app-title" content="Verbo Gourmet"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Verbo Gourmet</title>
<style>
*{box-sizing:border-box;margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
:root{--b:#0e2a52;--bg:#e9eef5;--c:#fff;--t:#0f1b2e;--m:#5f6f87;--ok:#2e7d4f;--no:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0a1426;--c:#12213d;--t:#e8edf5;--m:#98a6bd;--b:#2f5fae}nav .on{color:#9ec1ff}}
body{background:var(--bg);color:var(--t)}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 25%,#1d4378,#0a1d3b 70%);color:#e9eef7}#login>*{width:100%;max-width:340px}#login>#logo{width:190px;border-radius:28px;box-shadow:0 10px 40px #0009;margin-bottom:18px}
#login h1{font-size:34px;font-weight:700}#login p{opacity:.85;margin-bottom:8px}
input,select{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid #8884;background:var(--c);color:var(--t);font-size:16px}
button.p{width:100%;padding:15px;border:0;border-radius:12px;background:var(--b);color:#fff;font-size:17px;font-weight:600}
#login button.p{background:linear-gradient(#f4f7fb,#b9c4d4);color:#0e2a52}#err{color:#ffd0d0;min-height:20px}
main{padding:16px 16px 110px}h2{font-size:24px;margin:8px 0 14px}
.c{background:var(--c);border-radius:16px;padding:14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .c{margin:0}
.g b{display:block;font-size:20px;margin-top:4px}.in{color:var(--ok)}.out{color:var(--no)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row small,small{color:var(--m)}
.bt{border:0;background:none;font-size:18px;padding:4px 6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(16px);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #8883}
nav button{flex:1;border:0;background:none;color:var(--m);font-size:11px;padding:4px}nav i{display:block;font-style:normal;font-size:22px}nav .on{color:var(--b);font-weight:700}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:#8882}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(#0e2a52,#0a1d3b);color:#e9eef7}header img{width:34px;height:34px;border-radius:8px}header b{flex:1}header .chip{background:#c7cfdb;color:#0e2a52;font-weight:600}header button{border:0;background:none;color:#c7cfdb;font-size:14px}
[hidden]{display:none!important}body{overflow-x:hidden}.c{overflow-wrap:anywhere}input[type=date]{-webkit-appearance:none;appearance:none;min-height:50px;text-align:left}input{min-width:0;max-width:100%}nav button{white-space:nowrap}nav svg{display:block;margin:0 auto 2px}.sp{display:inline-block;width:16px;height:16px;border:2.5px solid #0e2a52;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes r{to{transform:rotate(360deg)}}@keyframes fi{from{opacity:0;transform:translateY(12px)}}#wel{display:none;font-size:23px;font-weight:600;line-height:1.35;animation:fi .6s}.ok #wel{display:block}.ok #pw,.ok #err,.ok #go,.ok #sub{display:none}.ck{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(#f4f7fb,#b9c4d4);color:#0e2a52;font-size:34px;line-height:64px}
.row>div:first-child{min-width:0}.row>div:last-child{white-space:nowrap;flex-shrink:0}
.hero{background:linear-gradient(135deg,#0e2a52,#1d4378 60%,#7f8ea6);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 8px 24px #0e2a5255}.hero small{color:#c7cfdb;display:block}.hero b{display:block;font-size:34px;margin:4px 0 6px}.hero span{font-size:13px;color:#dbe3ef}
.pend{border:1px solid #b3261e55}.pend b{display:block;font-size:20px;margin:4px 0}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:0;right:0;margin:auto;width:max-content;background:#2e7d4f;color:#fff;padding:10px 18px;border-radius:99px;z-index:20;font-weight:600}
.t{width:100%;border-collapse:collapse;margin-top:8px}.t td,.t th{padding:6px 2px;font-size:13px;text-align:right}.t td:first-child,.t th:first-child{text-align:left}.t th{color:var(--m);font-weight:600}details summary{font-weight:600}
@media print{nav,.noprint{display:none}}
</style></head><body>
<div id="login"><img id="logo" alt="Verbo Gourmet"><p id="sub">Financeiro e despesas</p>
<input id="pw" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key=='Enter')entrar()">
<div id="err"></div><button class="p" id="go" onclick="entrar()">Entrar</button><div id="wel"></div></div>
<div id="app" hidden></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzG0EHNOLlRbVJtwyJkcS6KMaYsRq_de3b6q9IvSP0D7oyKMQgmmPtlcHRsnB_CuiCmRw/exec', IMG='https://i.ibb.co/GjwfK1V/IMG-3685.jpg';
const CAT=['Salgados e lanches','Ingredientes','Bebidas','Embalagens','Limpeza','Outros'];
const AC={VENDAS:1,EVENTOS:1,OFERTA:1,SALDO:1,COMPRAS:-1,PAGAMENTO:-1,'DESPESAS IGREJA':-1,'TRANSFERÊNCIA':0};
let S={t:null,role:null,L:[],D:[],H:[],tab:'rel',mes:'',ed:null};
const $=s=>document.querySelector(s),R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const adm=()=>S.role=='admin',tot=x=>(+x.conta||0)+(+x.dinheiro||0),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const dt=d=>String(d).split('-').reverse().join('/'),esc=s=>String(s??'').replace(/"/g,'&quot;'),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('#logo').src=IMG;
async function api(o){const r=await fetch(API,{method:'POST',body:JSON.stringify({t:S.t,...o})}),j=await r.json();if(j.erro)throw j.erro;return j}
async function entrar(){const b=$('#go');if(b.disabled||!$('#pw').value)return;$('#err').textContent='';b.disabled=true;b.innerHTML='<span class="sp"></span>Verificando...';
try{const j=await api({a:'login',p:$('#pw').value});S.t=j.token;S.role=j.role;S.tab=adm()?'lan':'rel';try{localStorage.setItem('vg',JSON.stringify({t:j.token,r:j.role}))}catch(e){}
$('#wel').innerHTML='<div class="ck">✓</div>'+(adm()?'Bem-vindo, administrador da Verbo Gourmet':'Bem-vindo, liderança da Verbo Sobradinho');$('#login').classList.add('ok');
await Promise.all([load(),new Promise(r=>setTimeout(r,2200))]);$('#login').hidden=true;$('#app').hidden=false;scrollTo(0,0)}
catch(e){$('#err').textContent=e;$('#login').classList.remove('ok');b.disabled=false;b.textContent='Entrar'}}
function sair(){try{localStorage.removeItem('vg')}catch(e){}location.reload()}
let ult=0;async function load(){const j=await api({a:'list'});ult=Date.now();Object.assign(S,{L:j.L,D:j.D,H:j.H});draw()}
async function atualizar(){if(S.busy)return;S.busy=1;const b=$('#rf');if(b)b.style.animation='r .7s linear infinite';try{await load();toast('✓ Dados atualizados')}catch(e){alert(e);if(/Sessão/.test(e))sair()}S.busy=0}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.t&&!S.busy&&['rel','his'].includes(S.tab)&&Date.now()-ult>60000)load().catch(()=>{})});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function envia(n,a,r){if(S.busy)return;S.busy=1;if(a=='del')r=(n=='Despesas'?S.D:S.L).find(x=>x.id==r.id)||r;try{await api({a,n,r});S.ed=null;await load();toast('✓ Feito')}catch(e){alert(e);if(/Sessão/.test(e))sair()}S.busy=0}
function draw(){try{localStorage.setItem('vgt',S.tab)}catch(e){}const t=[['rel','📊','Relatório'],['dsp','','Despesas gerais']];if(adm()){t.unshift(['lan','➕','Lançamento']);t.push(['his','🕘','Histórico'])}
$('#app').innerHTML=`<header class="noprint"><img src="${IMG}"><b>Verbo Gourmet</b><span class="chip">${adm()?'Admin':'Liderança'}</span><button id="rf" onclick="atualizar()" title="Atualizar dados" style="font-size:21px;display:inline-block">↻</button><button onclick="sair()">Sair</button></header><main>${{rel,dsp,lan,his}[S.tab]()}</main><nav>${t.map(x=>`<button class="${x[0]==S.tab?'on':''}" onclick="S.tab='${x[0]}';S.ed=null;S.pay=null;draw()"><i>${ic(x[0])}</i>${x[2]}</button>`).join('')}</nav>`}
function lan(){const d=S.pay&&S.D.find(x=>x.id==S.pay),e=S.ed||(d?{data:today(),acao:'DESPESAS IGREJA',descricao:String(d.item).toUpperCase(),conta:d.valor,dinheiro:''}:{data:today(),acao:'VENDAS',descricao:'',conta:'',dinheiro:''}),n=v=>v?Math.abs(v):'',P=S.D.filter(x=>x.status=='Pendente');
return `<h2>${e.id?'Editar':'Novo'} lançamento</h2>${!e.id&&P.length?`<div class="c"><small>Pagar uma despesa pendente (opcional)</small><br><br><select onchange="S.pay=this.value;S.ed=null;draw()"><option value="">Escolher despesa...</option>${P.map(x=>`<option value="${x.id}" ${x.id==S.pay?'selected':''}>${x.item} · ${R(x.valor)}</option>`).join('')}</select><small>${d?'Confira o valor e salve: ela sai da lista de pendentes.':''}</small></div>`:''}
<div class="c"><input id="f_d" type="date" value="${e.data}">
<select id="f_a" onchange="$('#kw').hidden=this.value!='COMPRAS'">${Object.keys(AC).filter(k=>k!='SALDO'||e.acao=='SALDO').map(k=>`<option ${k==e.acao?'selected':''}>${k}</option>`).join('')}</select>
<div id="kw" ${e.acao=='COMPRAS'?'':'hidden'}><select id="f_k"><option value="">Categoria da compra...</option>${CAT.map(c=>`<option ${c==e.categoria?'selected':''}>${c}</option>`).join('')}</select></div>
<input id="f_s" placeholder="Descrição" value="${esc(e.descricao)}">
<input id="f_c" type="number" step="0.01" inputmode="decimal" placeholder="Valor em conta (Pix/cartão)" value="${n(e.conta)}">
<input id="f_h" type="number" step="0.01" inputmode="decimal" placeholder="Valor em dinheiro" value="${n(e.dinheiro)}">
<small>Transferência: informe só o valor em conta; ele sai do dinheiro.</small><br><br>
<button class="p" id="sv" onclick="salvarL()">Salvar lançamento</button></div>`}
async function salvarL(){const bt=$('#sv');if(bt.disabled)return;const a=$('#f_a').value,k=AC[a],c=+$('#f_c').value||0,h=+$('#f_h').value||0;
if(!$('#f_d').value||!(c||h))return alert('Preencha a data e um valor.');if(a=='COMPRAS'&&!$('#f_k').value)return alert('Escolha a categoria da compra (ou Outros).');
const r={id:S.ed?.id,data:$('#f_d').value,acao:a,descricao:$('#f_s').value.trim().toUpperCase(),conta:k?k*c:c,dinheiro:k?k*h:-c,usuario:'admin',categoria:a=='COMPRAS'?$('#f_k').value:''};
bt.disabled=true;bt.textContent='Salvando...';
try{const d=!S.ed&&S.pay&&S.D.find(x=>x.id==S.pay);if(!S.ed){const f=(await api({a:'list'})).L,q=v=>(+v||0).toFixed(2);if(f.some(x=>x.data==r.data&&x.acao==r.acao&&(x.descricao||'')==r.descricao&&q(x.conta)==q(r.conta)&&q(x.dinheiro)==q(r.dinheiro))&&!confirm('Já existe um lançamento igual (mesma data, ação, descrição e valores). Salvar mesmo assim?')){bt.disabled=false;bt.textContent='Salvar lançamento';return}}await api({a:S.ed?'edit':'add',n:'Lancamentos',r});let w='';
if(d){try{await api({a:'edit',n:'Despesas',r:{...d,status:'Pago'}})}catch(x){w='Lançamento salvo, mas não consegui baixar a despesa pendente. Edite-a em Despesas gerais.'}}
S.ed=null;S.pay=null;await load();w?alert(w):toast('✓ Lançamento salvo')}
catch(e){alert(e);if(/Sessão/.test(e))sair();bt.disabled=false;bt.textContent='Salvar lançamento'}}
function rel(){const ms=[...new Set(S.L.map(x=>x.data.slice(0,7)))].sort().reverse(),m=S.mes||'geral',G=m=='geral';
const rs=S.L.filter(x=>G||x.data.slice(0,7)==m).sort((a,b)=>a.data<b.data?-1:1),mv=rs.filter(x=>x.acao!='SALDO'&&!/^TRANSFER/i.test(x.acao));
const en=sum(mv.filter(x=>tot(x)>0),tot),sa=sum(mv.filter(x=>tot(x)<0),tot),ac=S.L.filter(x=>G||x.data.slice(0,7)<=m);
const cc=sum(ac,x=>+x.conta||0),cd=sum(ac,x=>+x.dinheiro||0),pp=sum(S.D.filter(x=>x.status=='Pendente'),x=>+x.valor||0),by={};mv.forEach(x=>by[x.acao]=(by[x.acao]||0)+tot(x));
S.pd={m,G,en,sa,cc,cd,pp,by,rs,ct:cats(mv),b:G?(ms[0]||today().slice(0,7)):m};S.rep=`VERBO GOURMET - ${G?'GERAL':m.split('-').reverse().join('/')}\nEntradas: ${R(en)}\nSaídas: ${R(-sa)}\nResultado: ${R(en+sa)}\nSaldo em conta: ${R(cc)}\nSaldo em dinheiro: ${R(cd)}\nSaldo total: ${R(cc+cd)}\nA pagar (pendentes): ${R(pp)}\n`+Object.entries(by).map(([k,v])=>`${k}: ${R(v)}`).join('\n');
return `<h2>Relatório</h2><select onchange="S.mes=this.value;draw()"><option value="geral" ${G?'selected':''}>Geral (todos os períodos)</option>${ms.map(x=>`<option value="${x}" ${x==m?'selected':''}>${x.split('-').reverse().join('/')}</option>`).join('')}</select>
<div class="hero"><small>${G?'Saldo total':'Saldo no fim do mês'}</small><b>${R(cc+cd)}</b><span>Em conta ${R(cc)} · Em dinheiro ${R(cd)}</span></div>
<div class="g"><div class="c">Entradas<b class="in">${R(en)}</b></div><div class="c">Saídas<b class="out">${R(-sa)}</b></div></div>
<div class="c" style="margin-top:10px">Resultado do período<b style="display:block;font-size:20px;margin-top:4px">${R(en+sa)}</b></div>
<div class="c pend">Despesas a pagar (pendentes)<b class="out">${R(pp)}</b><small>Saldo após pagar tudo: ${R(cc+cd-pp)}</small>${(()=>{const v=S.D.filter(x=>x.status=='Pendente'&&x.vencimento&&x.vencimento<today());return v.length?`<br><small class="out">⚠ ${v.length} vencida(s): ${R(sum(v,x=>+x.valor||0))}</small>`:''})()}</div>
${S.pd.ct}${bloco(S.pd.b,1)}<div class="c">${Object.entries(by).map(([k,v])=>`<div class="row"><span>${k}</span><b>${R(v)}</b></div>`).join('')}</div>
${conf(ac)}<div class="g noprint" style="margin-bottom:12px"><button class="p" onclick="comp()">Compartilhar</button><button class="p" onclick="csv('${m}')">Baixar Excel</button></div>
<button class="p noprint" style="margin-bottom:14px;background:#555" onclick="pdf()">Gerar PDF com resumo do mês</button>
${G?mt():rs.map(x=>`<div class="c row"><div><small>${dt(x.data)} · ${x.acao}${x.categoria?' · '+x.categoria:''}</small><br>${x.descricao||'-'}</div><div style="text-align:right"><b class="${tot(x)<0?'out':'in'}">${R(tot(x))}</b>${adm()?`<br><button class="bt" onclick="S.ed=S.L.find(y=>y.id=='${x.id}');S.tab='lan';draw()">✏️</button><button class="bt" onclick="confirm('Excluir este lançamento?')&&envia('Lancamentos','del',{id:'${x.id}'})">🗑</button>`:''}</div></div>`).join('')}`}
const lb=k=>k.split('-').reverse().join('/'),pm=k=>{let[y,m]=k.split('-').map(Number);if(--m<1){m=12;y--}return y+'-'+String(m).padStart(2,'0')};
const mo=()=>{const o={};S.L.filter(x=>x.acao!='SALDO'&&!/^TRANSFER/i.test(x.acao)).forEach(x=>{const k=x.data.slice(0,7),v=o[k]||(o[k]={e:0,s:0});tot(x)>0?v.e+=tot(x):v.s-=tot(x)});return o};
function cmp(x,y){const o=mo(),a=o[x]||{e:0,s:0},p=o[y]||{e:0,s:0},f=(u,v,i)=>{if(!v)return'—';const q=(u-v)/Math.abs(v)*100,g=i?q<=0:q>=0;return`<span class="${g?'in':'out'}">${q>=0?'▲':'▼'} ${Math.abs(q).toFixed(0)}%</span>`};
return`<tr><th></th><th>${lb(x)}</th><th>${lb(y)}</th><th>Var.</th></tr>`+[['Entradas',a.e,p.e,0],['Saídas',a.s,p.s,1],['Resultado',a.e-a.s,p.e-p.s,0]].map(([n,u,v,i])=>`<tr><td>${n}</td><td>${R(u)}</td><td>${R(v)}</td><td>${f(u,v,i)}</td></tr>`).join('')}
function gb(cats,ser){const H=110,B=140,mx=Math.max(1,...ser.flatMap(s=>s.v)),gw=340/cats.length,bw=Math.min(40,(gw-16)/ser.length),f=v=>Math.round(v).toLocaleString('pt-BR');
return`<svg viewBox="0 0 340 168" width="100%" role="img"><line x1="0" x2="340" y1="${B}" y2="${B}" style="stroke:var(--m,#5f6f87);opacity:.4"/>${cats.map((c,i)=>{const x0=i*gw+gw/2-bw*ser.length/2;return ser.map((s,j)=>{const h=s.v[i]/mx*H,x=x0+j*bw;return`<rect x="${x+1}" y="${B-h}" width="${bw-2}" height="${h}" rx="3" style="fill:${s.c}"/><text x="${x+bw/2}" y="${B-h-4}" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--t,#0f1b2e)">${f(s.v[i])}</text>`}).join('')+`<text x="${i*gw+gw/2}" y="158" text-anchor="middle" font-size="11" style="fill:var(--m,#5f6f87)">${c}</text>`}).join('')}</svg>`}
const leg=a=>`<small>${a.map(([n,c])=>`<span style="color:${c}">■</span> ${n}`).join(' &nbsp; ')}</small>`,
msel=(v,k,ms)=>`<select style="flex:1;width:auto;margin:0;padding:10px" onchange="S.${k}=this.value;draw()">${[...new Set([...ms,v])].sort().reverse().map(x=>`<option value="${x}" ${x==v?'selected':''}>${lb(x)}</option>`).join('')}</select>`;
const bloco=(b,ed)=>{const x=S.c1||b,y=S.c2||pm(b),o=mo(),A=o[x]||{e:0,s:0},B=o[y]||{e:0,s:0},ms=Object.keys(o),k3=[];for(let k=b,i=0;i<3;i++,k=pm(k))k3.unshift(k);
return`<div class="c"><b>Comparar meses</b>${ed?`<div class="row noprint" style="justify-content:flex-start;gap:8px;margin:10px 0 4px">${msel(x,'c1',ms)}<b>×</b>${msel(y,'c2',ms)}</div>`:`<br><small>${lb(x)} × ${lb(y)}</small>`}<table class="t">${cmp(x,y)}</table>${gb(['Entradas','Saídas'],[{n:lb(x),c:'var(--b,#0e2a52)',v:[A.e,A.s]},{n:lb(y),c:'#8fa0ba',v:[B.e,B.s]}])}${leg([[lb(x),'var(--b,#0e2a52)'],[lb(y),'#8fa0ba']])}</div>
<div class="c"><b>Entradas × Saídas</b> <small>(últimos 3 meses · valores em R$)</small>${gb(k3.map(k=>`${k.slice(5)}/${k.slice(2,4)}`),[{n:'Entradas',c:'var(--ok,#2e7d4f)',v:k3.map(k=>o[k]?.e||0)},{n:'Saídas',c:'var(--no,#b3261e)',v:k3.map(k=>o[k]?.s||0)}])}${leg([['Entradas','var(--ok,#2e7d4f)'],['Saídas','var(--no,#b3261e)']])}</div>`};
function conf(ac){const o={},k={},dup=[];ac.forEach(x=>{const v=o[x.acao]||(o[x.acao]={n:0,c:0,d:0});v.n++;v.c+=+x.conta||0;v.d+=+x.dinheiro||0;const y=[x.data,x.acao,x.descricao,x.conta,x.dinheiro].join('|');k[y]?dup.push(`${dt(x.data)} ${x.acao} ${x.descricao}`):k[y]=1});

function cats(rs){const o={};rs.filter(x=>x.acao=='COMPRAS').forEach(x=>{const k=x.categoria||'Sem categoria';o[k]=(o[k]||0)-tot(x)});const T=sum(Object.values(o),v=>v);if(!T)return'';
